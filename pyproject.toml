[project]
name = "filinglens"
version = "0.1.0"
description = "Evidence-backed SEC filing intelligence engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "live_sec: optional tests that call live SEC endpoints (require FILINGLENS_LIVE_SEC=1)",
    "live_llm: optional tests that call a paid LLM provider (require FILINGLENS_LIVE_LLM=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["filinglens"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*"]
ignore_missing_imports = true
